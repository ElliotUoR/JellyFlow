<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>JellyFlow — Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page admin-page">
    <h1>Admin</h1>

    <form id="login-form" class="login-form">
      <p class="tagline">Enter the admin password to access admin panel</p>
      <input type="password" id="login-password" name="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <p id="login-error" class="form-error" hidden></p>
    </form>

    <section id="dashboard" hidden>
      <div class="dashboard-header">
        <select id="days-select">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
        <button type="button" id="logout-button" class="link-button">Log out</button>
      </div>

      <div class="stat-tiles">
        <div class="stat-tile">
          <span class="stat-value" id="stat-visitors">—</span>
          <span class="stat-label">Unique visitors</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="stat-pageviews">—</span>
          <span class="stat-label">Pageviews</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="stat-session-length">—</span>
          <span class="stat-label">Avg. session length</span>
        </div>
      </div>

      <div class="chart-panel">
        <canvas id="pageviews-chart" height="220"></canvas>
      </div>

      <div class="tables-row">
        <div class="chart-panel">
          <h2>Top pages</h2>
          <table id="top-paths-table" class="stats-table"></table>
        </div>
        <div class="chart-panel">
          <h2>Top referrers</h2>
          <table id="top-referrers-table" class="stats-table"></table>
        </div>
        <div class="chart-panel">
          <h2>Top browsers</h2>
          <table id="top-browsers-table" class="stats-table"></table>
        </div>
        <div class="chart-panel">
          <h2>Top operating systems</h2>
          <table id="top-os-table" class="stats-table"></table>
        </div>
        <div class="chart-panel">
          <h2>Device types</h2>
          <table id="top-device-types-table" class="stats-table"></table>
        </div>
      </div>

      <div class="chart-panel">
        <div class="dashboard-header">
          <h2>Short links</h2>
          <span id="shortlinks-page-info" class="page-info"></span>
        </div>
        <table id="shortlinks-table" class="stats-table"></table>
        <div class="pagination-controls">
          <button type="button" id="shortlinks-prev" class="link-button">&larr; Newer</button>
          <button type="button" id="shortlinks-next" class="link-button">Older &rarr;</button>
        </div>
      </div>
    </section>

    <p id="dashboard-error" class="form-error" hidden></p>

    <p><a href="index.html">&larr; Back to JellyFlow</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script type="module" src="admin.js"></script>
  <script type="module" src="adminBadge.js"></script>
</body>
</html>
