<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- The title carried the brand name and nothing else, so the only query
       this page could ever match was "jellyflow" - which is why it surfaced
       for the domain and nothing else. -->
  <title>JellyFlow — RS3 Leagues II planner and other projects</title>

  <!-- Without this Google builds the snippet out of whatever visible text it
       finds, which is how "Leagues Planner RS3 Leagues region & gear planner
       -> Site analytics" (the card text and the footer link, run together)
       ended up as the search result description. -->
  <meta
    name="description"
    content="JellyFlow hosts the RS3 Leagues II: Equilibrium planner - pick region unlocks, build relic combos and plan gear loadouts for every combat style."
  />

  <!-- http://jellyflow.xyz and https://jellyflow.xyz are indexed as two
       separate results. Caddy already 308s http to https, so the http entry is
       stale, but a canonical is what actually consolidates the ranking signal
       onto one URL instead of splitting it across both. -->
  <link rel="canonical" href="https://jellyflow.xyz/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="JellyFlow — RS3 Leagues II planner and other projects" />
  <meta
    property="og:description"
    content="JellyFlow hosts the RS3 Leagues II: Equilibrium planner - pick region unlocks, build relic combos and plan gear loadouts for every combat style."
  />
  <meta property="og:url" content="https://jellyflow.xyz/" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html">
      <img src="favicon.svg" alt="" />
      JellyFlow
    </a>
    <a class="nav-link" href="admin.html">Admin</a>
  </nav>

  <main class="page">
    <div class="hero">
      <div class="hero-title-row">
        <h1>JellyFlow</h1>
        <p class="tagline">What are you looking for?</p>
      </div>
      <span class="hero-meta">1 project hosted on this domain</span>
    </div>

    <ul class="project-list">
      <li>
        <a class="project-card" href="/Leagues/">
          <span class="project-card-text">
            <span class="project-name">Leagues Planner</span>
            <span class="project-desc">RS3 Leagues region &amp; gear planner</span>
          </span>
          <span class="project-arrow" aria-hidden="true">&rarr;</span>
        </a>
      </li>
    </ul>
  </main>

  <footer class="site-footer">
    <a href="admin.html">Site analytics</a>
  </footer>

  <script type="module" src="adminBadge.js"></script>
</body>
</html>
